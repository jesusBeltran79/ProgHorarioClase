# Levanta el sistema completo con un solo comando
#   docker compose up --build
# Interfaz web   http://localhost:4200   (usuario admin, clave Horarios2026*)
# API REST       http://localhost:8080
# PostgreSQL     localhost:5432          (base horarios, usuario horarios, clave horarios)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horarios
      POSTGRES_USER: horarios
      POSTGRES_PASSWORD: horarios
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horarios -d horarios"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/horarios
      DB_USUARIO: horarios
      DB_CLAVE: horarios
      JWT_SECRETO: ${JWT_SECRETO:-cambie-este-secreto-de-desarrollo-del-grupo-5-pn2-2026}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-Horarios2026*}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datos-postgres:
