name: Integración continua

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compilación, pruebas y estrés)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar las pruebas JUnit
        run: mvn -B -ntp verify

      - name: Prueba de estrés 1x 3x 5x 10x
        run: java -Xss64m -cp target/classes co.edu.unbosque.horarios.app.PruebaEstres target/evidencias/estres 60000

      - name: Resumen de pruebas y entorno
        if: always()
        run: |
          mkdir -p target/evidencias/qa
          python3 ../.github/scripts/resumen_pruebas.py target/surefire-reports > target/evidencias/qa/pruebas_unitarias.txt || true
          cat target/evidencias/qa/pruebas_unitarias.txt || true
          {
            echo "Entorno de medición (GitHub Actions ubuntu-latest)"
            java -version 2>&1
            mvn -v 2>&1 | head -1
            echo "CPU $(nproc) núcleos $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
            echo "Memoria $(free -h | awk '/Mem/{print $2}')"
          } > target/evidencias/entorno.txt

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-backend
          path: |
            backend/target/evidencias
            backend/target/surefire-reports
          retention-days: 14


  frontend:
    name: Frontend (compilación Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production

  sistema:
    name: Sistema completo con Docker Compose y recorrido de punta a punta
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema desde cero
        run: docker compose up -d --build

      - name: Esperar a que la interfaz y la API respondan
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4200/actuator/health | grep -q UP; then echo "Sistema arriba en $((i*2)) s"; exit 0; fi
            sleep 2
          done
          docker compose ps; docker compose logs; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recorrido de punta a punta con capturas
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p ../salida && node capturas.mjs http://localhost:4200 ../salida/capturas

      - name: Pruebas de ruptura contra la API desplegada
        run: bash .github/scripts/ruptura_api.sh http://localhost:4200 salida/ruptura_api.log

      - name: Registro de los contenedores
        if: always()
        run: |
          mkdir -p salida
          docker compose ps > salida/contenedores.txt
          docker compose logs --no-color > salida/docker_compose.log
          docker compose images >> salida/contenedores.txt

      - name: Publicar evidencias del sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-sistema
          path: salida
          retention-days: 14
