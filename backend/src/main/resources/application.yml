spring:
  application:
    name: motor-horarios
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/horarios}
    username: ${DB_USUARIO:horarios}
    password: ${DB_CLAVE:horarios}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PUERTO:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # En producción se reemplaza con la variable de entorno JWT_SECRETO (mínimo 32 caracteres).
    secreto: ${JWT_SECRETO:cambie-este-secreto-de-desarrollo-del-grupo-5-pn2-2026}
    minutos: ${JWT_MINUTOS:480}
  admin:
    usuario: ${ADMIN_USUARIO:admin}
    clave: ${ADMIN_CLAVE:Horarios2026*}
  motor:
    limite-ms: ${MOTOR_LIMITE_MS:60000}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200}

logging:
  level:
    root: INFO
    co.edu.unbosque.horarios: INFO
